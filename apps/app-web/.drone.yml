kind: pipeline
type: docker
name: zhishu-app-web

trigger:
  branch:
    - master
  event:
    - push
    - custom

concurrency:
  limit: 1

volumes:
  - name: pnpm-cache
    host:
      path: /var/lib/drone-cache/pnpm/zhishu-app-web

steps:
  - name: build and package
    image: node:22-alpine
    volumes:
      - name: pnpm-cache
        path: /cache
    commands:
      - APP_NAME=app-web
      - APP_PACKAGE=@zhishu/$APP_NAME
      - echo "Building commit $DRONE_COMMIT_SHA"
      - corepack enable
      - corepack prepare pnpm@9.15.4 --activate
      - pnpm config set store-dir /cache/pnpm-store
      - pnpm config set registry https://registry.npmmirror.com/
      - pnpm --fail-if-no-match --filter "$APP_PACKAGE..." install --frozen-lockfile
      # Build runs typecheck, regenerates API clients and routes, then bundles with Vite.
      # VITE_API_BASE_URL stays unset: the bundle calls /api on its own origin.
      - pnpm --fail-if-no-match --filter "$APP_PACKAGE" run build
      - tar -czf /drone/src/$APP_NAME.tar.gz -C apps/$APP_NAME dist

  - name: scp
    image: appleboy/drone-scp
    settings:
      debug: false
      source:
        - app-web.tar.gz
      host:
        from_secret: CURRENT_HOST
      username: root
      port: 22
      password:
        from_secret: SSH_PWD
      target: /temp/app/zhishu/app-web/${DRONE_BUILD_NUMBER}

  - name: deploy
    image: appleboy/drone-ssh
    settings:
      host:
        from_secret: CURRENT_HOST
      username: root
      password:
        from_secret: SSH_PWD
      port: 22
      command_timeout: 2m
      script:
        - set -eu
        - umask 077
        - APP_NAME=app-web
        # Match the root configured in the host reverse-proxy static site config.
        - APP_DIR=/data/app/zhishu-app-web
        - RELEASE_ROOT=/temp/app/zhishu/app-web/${DRONE_BUILD_NUMBER}
        - RELEASE_DIR=$RELEASE_ROOT/release
        - BACKUP_DIR=/data/app/zhishu-backups/$APP_NAME-${DRONE_BUILD_NUMBER}-$(date -u +%Y%m%dT%H%M%SZ)
        - mkdir -p "$RELEASE_DIR" "$BACKUP_DIR" "$(dirname "$APP_DIR")"
        - tar -xzf "$RELEASE_ROOT/app-web.tar.gz" -C "$RELEASE_DIR"
        - test -s "$RELEASE_DIR/dist/index.html"
        - if [ -e "$APP_DIR" ]; then mv "$APP_DIR" "$BACKUP_DIR/app-web"; fi
        - mv "$RELEASE_DIR" "$APP_DIR"
        - chmod 755 "$APP_DIR"
        - chmod -R a+rX "$APP_DIR/dist"
        - rm -rf "$RELEASE_ROOT"
        - echo "$APP_NAME deployment complete. Previous files are in $BACKUP_DIR."
