kind: pipeline
type: docker
name: zhishu-app-server

trigger:
  branch:
    - master
  event:
    - push
    - custom

concurrency:
  limit: 1

volumes:
  - name: pnpm-cache
    host:
      path: /var/lib/drone-cache/pnpm/zhishu-app-server

steps:
  - name: build and package
    image: node:22-alpine
    volumes:
      - name: pnpm-cache
        path: /cache
    environment:
      API_CONFIG_TOKEN_SECRET:
        from_secret: API_CONFIG_TOKEN_SECRET
    commands:
      - APP_NAME=app-server
      - APP_PACKAGE=@zhishu/$APP_NAME
      - APP_DEPLOY_DIR=/drone/src/output/$APP_NAME
      - corepack enable
      - corepack prepare pnpm@9.15.4 --activate
      - pnpm config set store-dir /cache/pnpm-store
      - pnpm config set registry https://registry.npmmirror.com/
      - pnpm --fail-if-no-match --filter "$APP_PACKAGE..." install --frozen-lockfile
      - pnpm -r --fail-if-no-match --filter "$APP_PACKAGE..." run build
      # Keep dev dependencies for the versioned Drizzle migration CLI.
      - pnpm --fail-if-no-match --filter "$APP_PACKAGE" deploy --node-linker=hoisted --prod=false "$APP_DEPLOY_DIR"
      - cd "$APP_DEPLOY_DIR"
      # Register zhishu-app-server on the config service if the name is new there.
      - 'wget -q --header="Authorization: Bearer $API_CONFIG_TOKEN_SECRET" "http://config.8and1.cn/api/pull/zhishu-app-server/env" -O .env'
      - test -s .env
      - test -s dist/src/server.js
      - test -s database/drizzle.config.ts

      - tar -czf /drone/src/$APP_NAME.tar.gz .
      - chmod 644 /drone/src/$APP_NAME.tar.gz
      - ls -ld /drone /drone/src /drone/src/$APP_NAME.tar.gz

  - name: scp
    image: appleboy/drone-scp
    settings:
      debug: false
      source:
        - app-server.tar.gz
      host:
        from_secret: CURRENT_HOST
      username: root
      port: 22
      password:
        from_secret: SSH_PWD
      target: /temp/app/zhishu/app-server/${DRONE_BUILD_NUMBER}

  - name: deploy
    image: appleboy/drone-ssh
    settings:
      host:
        from_secret: CURRENT_HOST
      username: root
      password:
        from_secret: SSH_PWD
      port: 22
      command_timeout: 10m
      script:
        - set -eu
        - umask 077
        - APP_NAME=app-server
        - APP_DIR=/data/app/zhishu-app-server
        - RELEASE_ROOT=/temp/app/zhishu/app-server/${DRONE_BUILD_NUMBER}
        - RELEASE_DIR=$RELEASE_ROOT/release
        - BACKUP_DIR=/data/app/zhishu-backups/$APP_NAME-${DRONE_BUILD_NUMBER}-$(date -u +%Y%m%dT%H%M%SZ)
        - mkdir -p "$RELEASE_DIR" "$BACKUP_DIR"
        - tar -xzf "$RELEASE_ROOT/app-server.tar.gz" -C "$RELEASE_DIR"
        - cd "$RELEASE_DIR"
        - test -s .env
        - test -s dist/src/server.js
        # Validate the environment and run migrations before stopping the current service.
        - docker compose -p zhishu-app-server config --quiet
        - docker compose -p zhishu-app-server run --rm --no-deps -T app-server node --env-file=.env -e "import('./dist/src/config.js').then(m => m.loadConfig()).catch((error) => { console.error(error instanceof Error ? error.message: error); process.exit(1); })"
        - docker compose -p zhishu-app-server run --rm --no-deps -T app-server node node_modules/drizzle-kit/bin.cjs migrate --config=database/drizzle.config.ts
        - |
          if docker container inspect zhishu-app-server >/dev/null 2>&1; then
            docker stop --time 30 zhishu-app-server
            docker rm zhishu-app-server
          fi
        - if [ -e "$APP_DIR" ]; then mv "$APP_DIR" "$BACKUP_DIR/app-server"; fi
        - mv "$RELEASE_DIR" "$APP_DIR"
        - cd "$APP_DIR"
        - |
          if ! docker compose -p zhishu-app-server up -d --force-recreate --wait; then
            docker compose -p zhishu-app-server logs --no-color --tail=100 app-server
            echo "Backend readiness failed. Previous files are in $BACKUP_DIR." >&2
            exit 1
          fi
        - docker compose -p zhishu-app-server ps
        - rm -rf "$RELEASE_ROOT"
        - echo "$APP_NAME deployment complete. Previous files are in $BACKUP_DIR."
