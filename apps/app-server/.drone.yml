kind: pipeline
type: docker
name: zhishu-app-server

trigger:
  branch:
    - master
  event:
    - push
    - custom

concurrency:
  limit: 1

volumes:
  - name: pnpm-cache
    host:
      path: /var/lib/drone-cache/pnpm/zhishu-app-server

steps:
  # Restore the pnpm store into /cache/pnpm-store before install (drone-volume-cache
  # manages the cache under the pnpm-cache host volume; the bare mount alone does not).
  - name: restore-pnpm-cache
    image: drillster/drone-volume-cache
    volumes:
      - name: pnpm-cache
        path: /cache
    settings:
      restore: true
      mount:
        - /cache/pnpm-store

  - name: build and package
    image: node:22-alpine
    volumes:
      - name: pnpm-cache
        path: /cache
    environment:
      API_CONFIG_TOKEN_SECRET:
        from_secret: API_CONFIG_TOKEN_SECRET
    commands:
      - APP_NAME=app-server
      - APP_PACKAGE=@zhishu/$APP_NAME
      - APP_DEPLOY_DIR=/drone/src/output/$APP_NAME
      - corepack enable
      - corepack prepare pnpm@9.15.4 --activate
      - pnpm config set store-dir /cache/pnpm-store
      - pnpm config set registry https://registry.npmmirror.com/
      - pnpm --fail-if-no-match --filter "$APP_PACKAGE..." install --frozen-lockfile
      - pnpm -r --fail-if-no-match --filter "$APP_PACKAGE..." run build
      - pnpm --fail-if-no-match --filter "$APP_PACKAGE" deploy --node-linker=hoisted --prod "$APP_DEPLOY_DIR"
      - cd "$APP_DEPLOY_DIR"
      - rm -rf node_modules/@electric-sql node_modules/gel node_modules/@types
      # Register zhishu-app-server on the config service if the name is new there.
      - 'wget -q --header="Authorization: Bearer $API_CONFIG_TOKEN_SECRET" "http://config.8and1.cn/api/pull/zhishu-app-server/env" -O .env'
      - test -s .env
      - test -s dist/src/server.js
      - test -s dist/src/scripts/run-migrations.js

      - tar -czf /drone/src/$APP_NAME.tar.gz .
      - chmod 644 /drone/src/$APP_NAME.tar.gz
      - ls -ld /drone /drone/src /drone/src/$APP_NAME.tar.gz

  # Persist the refreshed pnpm store after the build.
  - name: rebuild-pnpm-cache
    image: drillster/drone-volume-cache
    volumes:
      - name: pnpm-cache
        path: /cache
    settings:
      rebuild: true
      mount:
        - /cache/pnpm-store

  - name: scp
    image: appleboy/drone-scp
    settings:
      debug: false
      source:
        - app-server.tar.gz
      host:
        from_secret: CURRENT_HOST
      username: root
      port: 22
      password:
        from_secret: SSH_PWD
      target: /temp/app/zhishu/app-server/${DRONE_BUILD_NUMBER}

  - name: deploy
    image: appleboy/drone-ssh
    settings:
      host:
        from_secret: CURRENT_HOST
      username: root
      password:
        from_secret: SSH_PWD
      port: 22
      command_timeout: 10m
      script:
        - set -eu
        - umask 077
        - APP_NAME=app-server
        - APP_DIR=/data/app/zhishu-app-server
        - RELEASE_ROOT=/temp/app/zhishu/app-server/${DRONE_BUILD_NUMBER}
        # Replace the directory the running service bind-mounts: a bind mount is not
        # a busy use on the host, so unlinking old files never disturbs it, and the
        # per-build tar under RELEASE_ROOT stays as rollback material until success.
        - rm -rf "$APP_DIR"
        - mkdir -p "$APP_DIR"
        - tar -xzf "$RELEASE_ROOT/app-server.tar.gz" -C "$APP_DIR"
        - cd "$APP_DIR"
        - test -s .env
        - test -s dist/src/server.js
        # Prepare the log directory on the host: the package itself is bind-mounted
        # read-only, so the logger cannot create it from inside the container.
        - mkdir -p "$APP_DIR/logs"
        # Validate the environment, run migrations and assemble the full app graph
        # while the previous service still runs: `compose run` is a one-shot with no
        # published ports, so it never touches 9010/9011, and the server itself never
        # auto-migrates. Any failure aborts here, before the service is swapped.
        - docker compose -p zhishu-app-server config --quiet
        - docker compose -p zhishu-app-server run --rm --no-deps -T app-server node dist/src/scripts/run-migrations.js
        - docker compose -p zhishu-app-server run --rm --no-deps -T app-server node dist/src/scripts/startup-probe.js
        # --force-recreate replaces this project's own container with the compose
        # stop_grace_period, so no manual stop/rm. A foreign leftover (old-style
        # deploy, project named after its directory) publishing 9010/9011 would only
        # surface as "port is already allocated" after the old service is gone,
        # so name it here and abort while production is still up.
        - |
          SELF=$(docker container inspect -f '{{.Id}}' zhishu-app-server 2>/dev/null || true)
          for id in $(docker ps -q --no-trunc --filter publish=9010 --filter publish=9011); do
            if [ "$id" != "$SELF" ]; then
              docker ps --no-trunc --filter id="$id" --format 'Port holder: {{.Names}} {{.Ports}}' >&2
              echo "9010/9011 are zhishu-app-server's contract ports with the host proxy; stop and rm the holder, then re-run." >&2
              exit 1
            fi
          done
        - |
          if ! docker compose -p zhishu-app-server up -d --force-recreate --wait; then
            docker compose -p zhishu-app-server logs --no-color --tail=100 app-server
            docker ps --filter publish=9010 --filter publish=9011 --format 'Port holder: {{.Names}} {{.Status}} {{.Ports}}' >&2 || true
            ss -ltnp | grep -E ':(9010|9011)\b' >&2 || true
            echo "Backend readiness failed; the previous release is still under /temp/app/zhishu/app-server." >&2
            exit 1
          fi
        - docker compose -p zhishu-app-server ps
        - rm -rf "$RELEASE_ROOT"
        - echo "$APP_NAME deployment complete."
