# Production service definition shipped inside the app-server release package.
# Infrastructure (PostgreSQL, S3 storage, optional Qdrant) is expected to already
# exist on the host; DATABASE_URL and ASSET_STORAGE_* in .env point at them.
services:
  app-server:
    image: node:22-alpine
    container_name: zhishu-app-server
    working_dir: /data/app/zhishu-app-server
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      # The standalone collaboration listener must differ from the API port.
      COLLABORATION_PORT: 3001
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    # Loopback-only publishes; the host reverse proxy terminates TLS and serves
    # both /api (3000) and the collaborative websocket (3001).
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3001"
    volumes:
      - .:/data/app/zhishu-app-server:ro
      # The package stays read-only; the log directory is the one writable path inside it and is
      # prepared on the host by the deploy script, so the logger never has to create it.
      - ./logs:/data/app/zhishu-app-server/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - shared_network
    command: ["node", "dist/src/server.js"]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/ready', { signal: AbortSignal.timeout(4000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    init: true
    # Give collaboration sessions and durable acks time to flush before SIGKILL.
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  shared_network:
    external: true
